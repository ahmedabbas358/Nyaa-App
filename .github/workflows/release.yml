name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version tag override (e.g. v1.0.0)'
        required: false

jobs:
  build-and-release:
    name: Package, Sign & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Production Keystore
        id: decode_keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore
            echo "KEYSTORE_FILE=/tmp/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Warning: No production keystore secret configured. Release signing will fallback."
          fi

      - name: Run Full Pre-Release Verification Suites
        run: |
          ./gradlew test --stacktrace
          ./gradlew :testing:test --tests "com.aniflow.testing.FinalAcceptanceScenarioTest"

      - name: Assemble Release APK & Bundle AAB
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Organize & Rename Artifacts
        id: organize_artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p output/
          
          # Copy and rename APK
          cp app/build/outputs/apk/release/app-release.apk "output/AniFlow-${VERSION}.apk"
          # Copy and rename AAB
          cp app/build/outputs/bundle/release/app-release.aab "output/AniFlow-${VERSION}.aab"
          
          # Generate SHA256 checksums
          cd output
          sha256sum "AniFlow-${VERSION}.apk" > "AniFlow-${VERSION}.apk.sha256"
          sha256sum "AniFlow-${VERSION}.aab" > "AniFlow-${VERSION}.aab.sha256"
          
          # Generate Artifact Manifest
          cat <<EOF > release-manifest.json
          {
            "appName": "AniFlow",
            "version": "${VERSION}",
            "commitSha": "${{ github.sha }}",
            "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "appId": "com.aniflow.app",
            "dbVersion": 1,
            "parserVersion": 1
          }
          EOF
          cd ..

      - name: Clean Keystore Material
        if: always()
        run: rm -f /tmp/release.keystore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/AniFlow-*.apk
            output/AniFlow-*.aab
            output/*.sha256
            output/release-manifest.json
          generate_release_notes: true
          draft: false
          prerelease: false
