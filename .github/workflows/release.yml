name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version tag override (e.g. v1.0.0)'
        required: false

jobs:
  build-and-release:
    name: Package, Sign & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Configure Release Signing Keystore
        id: configure_keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore
            echo "KEYSTORE_FILE=/tmp/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "Using secret-provided production keystore."
          else
            echo "Generating automated release signing keystore for CI..."
            keytool -genkeypair -v -keystore /tmp/release.keystore -alias aniflow -keyalg RSA -keysize 2048 -validity 10000 -storepass aniflow -keypass aniflow -dname "CN=AniFlow, OU=AniFlow, O=AniFlow, L=Tokyo, S=Tokyo, C=JP"
            echo "KEYSTORE_FILE=/tmp/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=aniflow" >> $GITHUB_ENV
            echo "KEY_ALIAS=aniflow" >> $GITHUB_ENV
            echo "KEY_PASSWORD=aniflow" >> $GITHUB_ENV
            echo "Automated release signing keystore configured."
          fi

      - name: Run Full Pre-Release Verification Suites
        run: |
          ./gradlew :testing:test :domain:test --stacktrace --info > gradle-build.log 2>&1 || STATUS=$?
          if [ -n "$STATUS" ] && [ "$STATUS" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-diagnostics
            git add gradle-build.log -f
            git commit -m "ci(diagnostics): dump gradle-build.log"
            git push origin ci-diagnostics --force || true
            exit $STATUS
          fi

      - name: Upload Test Results & Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: |
            **/build/reports/tests/
            **/build/reports/
            gradle-build.log

      - name: Assemble Release APK & Bundle AAB
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Organize & Rename Artifacts
        id: organize_artifacts
        run: |
          RAW_VERSION="${{ inputs.version_override || github.ref_name }}"
          VERSION="${RAW_VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.0.0"
          fi
          echo "RELEASE_VERSION=${VERSION}" >> $GITHUB_ENV
          
          mkdir -p output/
          
          # Copy and rename APK
          cp app/build/outputs/apk/release/app-release.apk "output/AniFlow-${VERSION}.apk"
          # Copy and rename AAB
          cp app/build/outputs/bundle/release/app-release.aab "output/AniFlow-${VERSION}.aab"
          
          # Generate SHA256 checksums
          cd output
          sha256sum "AniFlow-${VERSION}.apk" > "AniFlow-${VERSION}.apk.sha256"
          sha256sum "AniFlow-${VERSION}.aab" > "AniFlow-${VERSION}.aab.sha256"
          
          # Generate Artifact Manifest
          cat <<EOF > release-manifest.json
          {
            "appName": "AniFlow",
            "version": "${VERSION}",
            "commitSha": "${{ github.sha }}",
            "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "appId": "com.aniflow.app",
            "dbVersion": 1,
            "parserVersion": 1
          }
          EOF
          cd ..

      - name: Clean Keystore Material
        if: always()
        run: rm -f /tmp/release.keystore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.RELEASE_VERSION }}"
          name: "AniFlow v${{ env.RELEASE_VERSION }}"
          files: |
            output/AniFlow-*.apk
            output/AniFlow-*.aab
            output/*.sha256
            output/release-manifest.json
          generate_release_notes: true
          draft: false
          prerelease: false
