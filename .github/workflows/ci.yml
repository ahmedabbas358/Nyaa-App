name: Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Build, Lint & Test Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Run Static Analysis & Architecture Verification
        run: |
          ./gradlew lintDebug --stacktrace || true
          ./gradlew :testing:test --tests "com.aniflow.testing.ArchitectureVerificationTests" --stacktrace --info

      - name: Run Unit & Integration Test Suites
        run: |
          ./gradlew :testing:test :domain:test --stacktrace --info > gradle-ci-test.log 2>&1 || STATUS=$?
          if [ -n "$STATUS" ] && [ "$STATUS" -ne 0 ]; then
            echo "=== CI GRADLE FAILURE LOG START ==="
            cat gradle-ci-test.log
            echo "=== CI GRADLE FAILURE LOG END ==="
            exit $STATUS
          fi

      - name: Build Debug Artifact
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Test Results & Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/reports/
            gradle-ci-test.log
