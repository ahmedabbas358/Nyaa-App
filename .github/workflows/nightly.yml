name: Nightly Reliability & Stress Suite

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 2:00 AM UTC
  workflow_dispatch:

jobs:
  nightly-stress-and-fuzz:
    name: Nightly Reliability Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Parser Fuzz & Regression Suites
        run: |
          ./gradlew :testing:test --tests "com.aniflow.testing.ParserFuzzTests" --stacktrace
          ./gradlew :testing:test --tests "com.aniflow.testing.ParserRegressionSuite" --stacktrace

      - name: Run Reliability, Chaos & Idempotency Suites
        run: |
          ./gradlew :testing:test --tests "com.aniflow.testing.ReliabilityAndChaosTests" --stacktrace
          ./gradlew :testing:test --tests "com.aniflow.testing.SecurityAndSanitizationTests" --stacktrace

      - name: Run End-to-End Acceptance Scenario
        run: |
          ./gradlew :testing:test --tests "com.aniflow.testing.FinalAcceptanceScenarioTest" --stacktrace
